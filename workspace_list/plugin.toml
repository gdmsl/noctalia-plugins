id = "gdmsl/workspace_list"
name = "Workspace List"
version = "0.1.0"
plugin_api = 42
author = "gdmsl"
license = "MIT"
icon = "list"
description = "A bar button that opens a list of every workspace, to switch by name when the bar runs out of room."
tags = ["workspaces", "niri", "hyprland"]
dependencies = []

[[widget]]
id = "bar"
entry = "bar.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 280
height = "content"
max_height = 600
placement = "attached"
position = "auto"
open_near_click = true
